<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="attention-grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#e8f4f8" stroke="#416D74" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="600" fill="url(#attention-grid)"/>
  
  <!-- WindSpeed attention pattern - more focused on specific regions -->
  <ellipse cx="300" cy="200" rx="100" ry="60" fill="#339587" opacity="0.6"/>
  <ellipse cx="500" cy="300" rx="80" ry="120" fill="#339587" opacity="0.4"/>
  <circle cx="650" cy="150" r="40" fill="#339587" opacity="0.7"/>
  <circle cx="150" cy="400" r="65" fill="#339587" opacity="0.3"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#416D74">
    WindSpeed Attention Analysis - Date1 (6h, 10ep)
  </text>
  
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Model attention regions for wind speed prediction
  </text>
</svg>
